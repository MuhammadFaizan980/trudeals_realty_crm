name: trudeals_realty_crm
description: "A 100% functional clone of TruDeals Realty CRM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  sizer: ^3.1.3
  dart_either: ^2.1.0
  intl: ^0.20.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6
  dio: ^5.11.0
  google_fonts: ^8.2.1
  file_picker: ^8.1.4
  share_plus: ^10.1.0
  url_launcher: ^6.3.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: 1.8.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
