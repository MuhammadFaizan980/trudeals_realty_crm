name: trudeals_realty_crm
description: "A 100% functional clone of TruDeals Realty CRM."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  sizer: ^3.1.3
  dart_either: ^2.1.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  dio: ^5.11.0
  google_fonts: ^8.2.1
  file_picker: ^8.3.7
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  collection: ^1.19.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#262926"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_fg.png"
  remove_alpha_ios: true
